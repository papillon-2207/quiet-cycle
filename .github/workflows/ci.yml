name: package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-15
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, resolved 2026-11-15
        with:
          python-version: ${{ matrix.python }}
      - id: install
        run: python -m pip install -c constraints-contracts.txt -e ".[dev,api,reference]"
      # After a successful install, each check runs even if an earlier check fails.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest --fail-on-skip --cov=quietcycle --cov-report=term
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/generate_contracts.py --check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/check_repository.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy src/quietcycle
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check src tests examples scripts
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m build
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/check_artifacts.py
