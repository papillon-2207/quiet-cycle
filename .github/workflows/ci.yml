name: package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        deps: [contracts]
        # Every entry sets deps, which names the constraints file. Because deps is also a matrix key,
        # the lowest entry becomes a job of its own and does not join the Ubuntu 3.11 job.
        include:
          - os: windows-latest
            python: '3.13'
            deps: contracts
          - os: macos-latest
            python: '3.13'
            deps: contracts
          - os: ubuntu-latest
            python: '3.11'
            deps: lowest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-11-15
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, resolved 2026-11-15
        with:
          python-version: ${{ matrix.python }}
      - id: install
        run: python -m pip install -c constraints-${{ matrix.deps }}.txt -e ".[dev,api,reference]"
      # After a successful install, each check runs even if an earlier check fails.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest --fail-on-skip --cov=quietcycle --cov-report=term
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/generate_contracts.py --check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/check_repository.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy src/quietcycle
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check src tests examples scripts
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m build
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/check_artifacts.py
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m twine check --strict dist/*
      # bash, so that a failing benchmark fails the step on Windows too.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          python scripts/benchmark_learning.py
          git diff --exit-code -- evidence
      # The mutations measure what the tests catch, not the platform; Linux covers 3.11 to 3.14.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        run: python scripts/run_mutations.py
